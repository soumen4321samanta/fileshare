<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send a File</title>
    <style>
        :root {
            --bg: #0f1115;
            --card: #171a21;
            --accent: #5b8cff;
            --accent-hover: #4a76e0;
            --text: #e8eaed;
            --muted: #9aa0a6;
            --border: #2a2e37;
            --success: #2e7d4f;
            --error: #b3413e;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 24px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 440px;
        }
        h1 {
            font-size: 22px;
            margin: 0 0 6px;
        }
        p.sub {
            color: var(--muted);
            margin: 0 0 24px;
            font-size: 14px;
        }
        .dropzone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 32px 16px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }
        .dropzone.dragover {
            border-color: var(--accent);
            background: rgba(91, 140, 255, 0.08);
        }
        .dropzone svg {
            margin-bottom: 8px;
            opacity: 0.7;
        }
        .dropzone p {
            margin: 4px 0;
            font-size: 14px;
            color: var(--muted);
        }
        #file-input {
            display: none;
        }
        #file-list {
            margin-top: 12px;
            font-size: 13px;
            color: var(--text);
        }
        #file-list div {
            padding: 6px 10px;
            background: #1e222b;
            border-radius: 8px;
            margin-bottom: 6px;
        }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }
        button:hover { background: var(--accent-hover); }
        button:disabled { background: #3a3f4a; cursor: not-allowed; }
        .messages {
            margin-bottom: 20px;
        }
        .messages li {
            list-style: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .messages .success { background: rgba(46, 125, 79, 0.2); color: #6fd99a; border: 1px solid var(--success); }
        .messages .error { background: rgba(179, 65, 62, 0.2); color: #ff9d9a; border: 1px solid var(--error); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Send a File</h1>
        <p class="sub">Choose or drag one or more files below to upload.</p>

        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
            <li class="{{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}

        <form method="post" enctype="multipart/form-data" id="upload-form">
            {% csrf_token %}
            <div class="dropzone" id="dropzone">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M12 16V4M12 4l-4 4M12 4l4 4M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <p><strong>Tap to choose files</strong></p>
                <p>or drag & drop here</p>
                <input type="file" name="file" id="file-input" multiple>
            </div>
            <div id="file-list"></div>
            <button type="submit" id="submit-btn" disabled>Upload</button>
        </form>
    </div>

    <script>
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('file-input');
        const fileList = document.getElementById('file-list');
        const submitBtn = document.getElementById('submit-btn');

        dropzone.addEventListener('click', () => fileInput.click());

        ['dragenter', 'dragover'].forEach(evt =>
            dropzone.addEventListener(evt, (e) => {
                e.preventDefault();
                dropzone.classList.add('dragover');
            })
        );
        ['dragleave', 'drop'].forEach(evt =>
            dropzone.addEventListener(evt, (e) => {
                e.preventDefault();
                dropzone.classList.remove('dragover');
            })
        );
        dropzone.addEventListener('drop', (e) => {
            fileInput.files = e.dataTransfer.files;
            renderFileList();
        });
        fileInput.addEventListener('change', renderFileList);

        function renderFileList() {
            fileList.innerHTML = '';
            const files = Array.from(fileInput.files);
            files.forEach(f => {
                const div = document.createElement('div');
                div.textContent = `${f.name} (${(f.size / 1024).toFixed(1)} KB)`;
                fileList.appendChild(div);
            });
            submitBtn.disabled = files.length === 0;
        }

        document.getElementById('upload-form').addEventListener('submit', () => {
            submitBtn.disabled = true;
            submitBtn.textContent = 'Uploading…';
        });
    </script>
</body>
</html>
